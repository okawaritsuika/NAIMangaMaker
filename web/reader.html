<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>만화 보기 · 한 컷씩</title>
<style>
:root{color-scheme:dark;--bg:#171c19;--panel:#242c26;--ink:#edf2ed;--muted:#aab8ac;--line:#3c493f;--accent:#c1e1c5;--toolbar-height:128px;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.6}button,select{font:inherit;color:inherit;background:#29332b;border:1px solid #4a594d;border-radius:8px;padding:8px 11px}button{font-weight:650;cursor:pointer;white-space:nowrap}button:hover:not(:disabled){border-color:#a8c7ae;background:#364339}button:disabled{opacity:.35;cursor:not-allowed}select{max-width:100%;min-width:0;cursor:pointer}a{color:var(--accent);text-underline-offset:3px}button,a,select{touch-action:manipulation}:focus-visible{outline:3px solid #a1d3ad;outline-offset:3px}h1,h2,h3,p,figure{margin:0}[hidden]{display:none!important}.muted{color:var(--muted)}.hint{font-size:12px;line-height:1.7;color:var(--muted)}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.spaced{margin-top:13px}.toolbar{position:sticky;top:0;z-index:10;background:#1e2721f5;border-bottom:1px solid var(--line);box-shadow:0 3px 20px #0002;padding:13px 24px;backdrop-filter:blur(10px)}.toolbar-top,.toolbar-bottom{display:flex;gap:16px;justify-content:space-between;align-items:center}.toolbar-bottom{margin-top:11px;gap:12px}.brand{display:flex;align-items:center;gap:13px;min-width:0}.brandmark{font-size:11px;letter-spacing:.6px;color:#aad0b2;white-space:nowrap}.title{font-size:16px;line-height:1.4;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:42vw}.toolbar-links{display:flex;gap:15px;align-items:center;white-space:nowrap;font-size:12px}.project-picker{display:flex;align-items:center;gap:8px;max-width:360px;min-width:150px}.project-picker label{font-size:12px;color:var(--muted);white-space:nowrap}.project-picker select{width:260px}.reader-options{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.segmented{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:9px;background:#17201a}.segmented button{border:0;background:transparent;padding:5px 10px;font-size:12px;font-weight:600;color:#aebbaf}.segmented button[aria-pressed=true]{background:#425748;color:#f0f8f1}.navigation{display:flex;align-items:center;gap:8px}.navigation select{min-width:98px;max-width:180px;font-size:12px}.navigation button{font-size:12px}.count{font-size:12px;color:var(--muted);min-width:62px;text-align:center}.status{margin:0;padding:11px 24px;background:#253a2c;color:#c6dfca;border-bottom:1px solid #3d5543;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.status.error{background:#482e29;border-color:#70483d;color:#f0c5b4}.status:empty{display:none}.reader{padding:20px 28px 34px;min-height:calc(100dvh - var(--toolbar-height));}.page{margin:0 auto 28px;scroll-margin-top:calc(var(--toolbar-height) + 15px);max-width:100%;}.page-bar{display:flex;align-items:center;justify-content:space-between;gap:15px;max-width:100%;margin:0 auto 11px;font-size:12px;color:#b7c7b9}.page-name{font-size:13px;font-weight:600;overflow-wrap:anywhere}.page-links{display:flex;gap:13px;flex-shrink:0;font-size:11px}.page-visual{display:flex;align-items:flex-start;justify-content:center;min-width:0;min-height:160px}.page-image{display:block;max-width:100%;height:auto;width:auto;box-shadow:0 7px 35px #0005;background:#fff}.fit-screen .page-image{max-height:calc(100dvh - var(--toolbar-height) - 105px);max-width:100%;width:auto;object-fit:contain}.fit-width .page-image{width:100%;max-width:100%;height:auto;max-height:none;object-fit:contain}.page-stale{font-size:11px;color:#dac18e;margin-top:10px;text-align:center}.page-end{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:14px;font-size:11px;color:#889b8c}.missing{width:min(100%,780px);min-height:360px;background:#202a23;border:1px dashed #59705e;border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:36px 30px;text-align:center}.missing h3{font-size:18px;margin-top:12px}.missing .symbol{font-size:35px;line-height:1;color:#819e89}.missing p{max-width:550px}.missing details{width:100%;max-width:570px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);text-align:left;font-size:12px}.missing summary{cursor:pointer;color:#c4d6c9}.missing ol{padding-left:21px;margin-bottom:0;color:var(--muted)}.missing li{padding:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:90px 25px;text-align:center;color:var(--muted)}.empty h2{font-size:21px;color:var(--ink);margin-bottom:10px}.book-end{text-align:center;margin:40px 0 10px;font-size:12px;color:var(--muted)}.single-mode .page{margin-bottom:0}.reader-help{font-size:11px;color:#8e9e91;text-align:center;margin-top:20px}.skip{position:absolute;left:14px;top:-60px;background:#eef6ef;color:#1c3b24;padding:9px 14px;z-index:20}.skip:focus{top:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:1600px){.toolbar{padding-inline:36px}.reader{padding-inline:40px}}
@media(max-width:1050px){.toolbar-bottom{flex-wrap:wrap}.reader-options{order:2;flex:1;justify-content:flex-end}.project-picker{max-width:48%}.navigation{margin-left:auto}.title{max-width:44vw}}
@media(max-width:680px){.toolbar{padding:11px 12px}.toolbar-top{gap:10px}.brand{gap:8px}.brandmark{display:none}.title{font-size:15px;max-width:50vw}.toolbar-links{gap:10px;font-size:11px}.toolbar-links .optional{display:none}.toolbar-bottom{gap:9px}.project-picker{max-width:none;width:calc(100% - 80px)}.project-picker select{width:100%}.navigation{order:2;width:100%;justify-content:center}.reader-options{order:3;flex:none;width:100%;justify-content:center;gap:9px}.segmented button{padding:5px 9px;font-size:11px}.reader{padding:13px 8px 24px}.page-bar{padding-inline:4px;font-size:11px;gap:9px}.page-links{gap:9px}.page-name{font-size:12px}.page{margin-bottom:22px}.fit-screen .page-image{max-height:calc(100dvh - var(--toolbar-height) - 88px)}.missing{padding:27px 20px;min-height:300px}.missing h3{font-size:16px}.status{padding:9px 13px}.reader-help{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}
</style>
</head>
<body>
<a href="#reader" class="skip">만화 본문으로 이동</a>
<header id="toolbar" class="toolbar">
  <div class="toolbar-top"><div class="brand"><span class="brandmark">한 컷씩 · 만화 보기</span><h1 id="bookTitle" class="title">만화를 불러오는 중</h1></div><nav class="toolbar-links" aria-label="작업실 이동"><a id="editorLink" href="/image-editor" hidden>이 페이지 편집</a><a id="workbenchLink" href="/">작업실로</a><a class="optional" href="/image-settings">이미지 설정</a></nav></div>
  <div class="toolbar-bottom"><div class="project-picker"><label for="projectSelect">작품</label><select id="projectSelect" disabled><option value="">불러오는 중…</option></select></div><div class="navigation" aria-label="페이지 이동"><button id="previous" type="button" disabled aria-label="이전 페이지">← 이전</button><label for="pageSelect" class="sr-only">페이지 선택</label><select id="pageSelect" disabled><option>페이지 없음</option></select><span id="pageCount" class="count" role="status" aria-live="polite">0 / 0</span><button id="next" type="button" disabled aria-label="다음 페이지">다음 →</button></div><div class="reader-options"><div class="segmented" aria-label="읽기 방식"><button id="singleMode" type="button" aria-pressed="true">한 페이지</button><button id="verticalMode" type="button" aria-pressed="false">전체 세로 읽기</button></div><div class="segmented" aria-label="그림 크기"><button id="screenFit" type="button" aria-pressed="true">화면 맞춤</button><button id="widthFit" type="button" aria-pressed="false">너비 맞춤</button></div><button id="refresh" type="button" aria-label="현재 작품 다시 불러오기">↻</button></div></div>
</header>
<p id="status" class="status" role="status" aria-live="polite">작품 목록을 확인하고 있어요.</p>
<main id="reader" class="reader single-mode fit-screen" tabindex="-1" aria-label="만화 페이지"><div class="empty"><h2>잠시만 기다려 주세요.</h2></div></main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const state = {projectId:params.get('project') || '',requestedPage:params.get('page') || '',project:null,pages:[],index:0,mode:'single',fit:'screen',loading:false,loadVersion:0,articles:[],scrollPending:false};
const prefsKey = 'comic-reader-preferences-v1';
function node(tag,text,className) { const el=document.createElement(tag); if(text !== undefined) el.textContent=text; if(className) el.className=className; return el; }
function say(message,error=false) { $('status').textContent=message; $('status').className='status'+(error?' error':''); measureToolbar(); }
function safeImage(value) { try { const url=new URL(value,location.origin); return url.origin===location.origin && url.pathname.startsWith('/files/') ? url.href : ''; } catch { return ''; } }
function readPreferences() { try { const saved=JSON.parse(localStorage.getItem(prefsKey)||'null'); if(saved && ['single','vertical'].includes(saved.mode)) state.mode=saved.mode; if(saved && ['screen','width'].includes(saved.fit)) state.fit=saved.fit; } catch {} }
function savePreferences() { try { localStorage.setItem(prefsKey,JSON.stringify({mode:state.mode,fit:state.fit})); } catch {} }
function measureToolbar() { document.documentElement.style.setProperty('--toolbar-height',Math.ceil($('toolbar').getBoundingClientRect().height)+'px'); }
async function get(path) {
  let response; try { response=await fetch(path,{method:'GET',cache:'no-store'}); } catch { throw new Error('작업실 서버에 연결하지 못했어요. 현재 화면은 유지했습니다.'); }
  let value; try { value=await response.json(); } catch { throw new Error('서버 응답을 읽지 못했어요. 현재 화면은 유지했습니다.'); }
  if(!response.ok) throw new Error(value.error||value.message||'작품을 불러오지 못했어요.');
  return value;
}
function pageName(page,index) { return page.title || (index+1)+'페이지'; }
function editorUrl(page) { return '/image-editor?project='+encodeURIComponent(state.projectId)+'&page='+encodeURIComponent(page.id); }
function updateUrl() {
  const url=new URL(location.href);
  if(state.projectId) url.searchParams.set('project',state.projectId); else url.searchParams.delete('project');
  const page=state.pages[state.index]; if(page) url.searchParams.set('page',page.id); else url.searchParams.delete('page');
  history.replaceState(null,'',url.pathname+url.search+url.hash);
}
function controls() {
  const total=state.pages.length, current=state.pages[state.index];
  $('previous').disabled=state.loading||!total||state.index===0;
  $('next').disabled=state.loading||!total||state.index===total-1;
  $('pageSelect').disabled=state.loading||!total;
  $('pageCount').textContent=(total?state.index+1:0)+' / '+total;
  $('pageSelect').value=current?current.id:'';
  $('editorLink').hidden=!current; if(current) $('editorLink').href=editorUrl(current);
  $('workbenchLink').href=state.projectId?'/?project='+encodeURIComponent(state.projectId):'/';
  $('refresh').disabled=state.loading;
  $('projectSelect').disabled=state.loading||!$('projectSelect').children.length;
  for(const [id,on] of [['singleMode',state.mode==='single'],['verticalMode',state.mode==='vertical'],['screenFit',state.fit==='screen'],['widthFit',state.fit==='width']]) $(id).setAttribute('aria-pressed',String(on));
  $('reader').className='reader '+(state.mode==='single'?'single-mode':'vertical-mode')+' fit-'+state.fit;
}
function missingCard(page,index,reason) {
  const card=node('div',undefined,'missing');
  card.append(node('div','▧','symbol'),node('h3',reason==='image-error'?'그림 파일을 불러오지 못했어요.':'아직 그림이 없는 페이지입니다.'));
  const message=reason==='image-error'?'파일 연결을 확인한 뒤 작품을 새로고침해 주세요. 페이지 순서와 내용은 유지됩니다.':page.status==='rendering'?'이 페이지의 그림을 생성하고 있어요. 완료 후 새로고침하면 볼 수 있습니다.':page.status==='failed'?'그림 생성이 완료되지 않았어요. 작업실에서 작업 기록을 확인하거나 이미지 편집실에서 다시 생성할 수 있습니다.':'이야기와 페이지 구성은 저장되어 있습니다. 이미지 편집실에서 이 페이지를 그릴 수 있어요.';
  card.append(node('p',message,'hint spaced'));
  const panels=new Map((state.project.panels||[]).map(panel=>[panel.id,panel]));
  const descriptions=(page.panel_ids||[]).map(id=>panels.get(id)).filter(Boolean);
  if(descriptions.length) { const details=node('details'); details.append(node('summary','이 페이지의 이야기 · '+descriptions.length+'컷')); const list=node('ol'); for(const panel of descriptions) list.append(node('li',panel.description_ko||panel.description||'컷 설명이 없습니다.')); details.append(list); card.append(details); }
  const link=node('a','이미지 편집실에서 열기','hint spaced'); link.href=editorUrl(page); card.append(link);
  return card;
}
function makePage(page,index) {
  const article=node('article',undefined,'page'); article.id='reader-page-'+index; article.dataset.index=String(index); article.setAttribute('aria-label',(index+1)+'페이지');
  const bar=node('div',undefined,'page-bar');
  bar.append(node('h2',(index+1)+' / '+state.pages.length+' · '+pageName(page,index),'page-name'));
  const links=node('div',undefined,'page-links'); const edit=node('a','이 페이지 편집'); edit.href=editorUrl(page); links.append(edit);
  const url=safeImage(page.image_url||'');
  if(url) { const original=node('a','이미지 파일 보기'); original.href=url; original.target='_blank'; original.rel='noopener'; links.append(original); }
  bar.append(links); article.append(bar);
  const visual=node('div',undefined,'page-visual');
  if(url) {
    const image=node('img'); image.className='page-image'; image.alt=(state.project.title||'만화')+' · '+(index+1)+'페이지'; image.src=url; image.decoding='async'; image.loading=(state.mode==='single'||Math.abs(index-state.index)<=1)?'eager':'lazy';
    if(Number.isFinite(page.width)&&Number.isFinite(page.height)&&page.width>0&&page.height>0) { image.width=page.width; image.height=page.height; }
    image.addEventListener('error',()=>{visual.replaceChildren(missingCard(page,index,'image-error'));});
    image.addEventListener('load',scheduleScrollTrack); visual.append(image);
  } else visual.append(missingCard(page,index));
  article.append(visual);
  if(page.stale&&url) article.append(node('p','페이지 수정 전의 그림이 현재 선택되어 있습니다.','page-stale'));
  article.append(node('div',(index+1)+'페이지 · '+(index===state.pages.length-1?'마지막 페이지':'다음 '+(index+2)+'페이지'),'page-end'));
  return article;
}
function renderPages() {
  $('reader').replaceChildren(); state.articles=[];
  if(!state.pages.length) { const empty=node('div',undefined,'empty'); empty.append(node('h2',state.project?'아직 구성된 페이지가 없어요.':'읽을 작품을 선택하세요.'),node('p',state.project?'작업실에서 컷을 페이지로 구성하면 여기에 표시됩니다.':'위의 작품 목록에서 만화를 불러올 수 있습니다.','hint')); $('reader').append(empty); controls(); return; }
  const indices=state.mode==='single'?[state.index]:state.pages.map((_,index)=>index);
  for(const index of indices) { const article=makePage(state.pages[index],index); state.articles.push(article); $('reader').append(article); }
  if(state.mode==='vertical') $('reader').append(node('p','현재 저장된 '+state.pages.length+'페이지를 모두 표시했습니다.','book-end'));
  else $('reader').append(node('p','← 이전 페이지 · 다음 페이지 →  |  너비 맞춤에서는 아래로 스크롤해 읽을 수 있습니다.','reader-help'));
  controls(); measureToolbar();
}
function scrollToCurrent() {
  const article=state.articles.find(row=>Number(row.dataset.index)===state.index);
  if(article) article.scrollIntoView({behavior:'instant',block:'start'});
}
function navigate(index,{scroll=true}={}) {
  if(!state.pages.length||state.loading) return;
  const next=Math.max(0,Math.min(state.pages.length-1,index));
  if(next!==state.index) { state.index=next; if(state.mode==='single') renderPages(); }
  controls(); updateUrl(); if(scroll) scrollToCurrent();
}
function trackScroll() {
  state.scrollPending=false;
  if(state.mode!=='vertical'||state.loading||!state.articles.length) return;
  const top=$('toolbar').getBoundingClientRect().bottom;
  const point=top+Math.max(30,(window.innerHeight-top)*.32);
  let index=state.index, distance=Infinity;
  for(const article of state.articles) { const rect=article.getBoundingClientRect(); const gap=rect.top>point?rect.top-point:rect.bottom<point?point-rect.bottom:0; if(gap<distance) {distance=gap;index=Number(article.dataset.index);} }
  if(index!==state.index) { state.index=index; controls(); updateUrl(); }
}
function scheduleScrollTrack() { if(!state.scrollPending) {state.scrollPending=true; requestAnimationFrame(trackScroll);} }
function setMode(mode) { if(!['single','vertical'].includes(mode)||state.mode===mode) return; state.mode=mode; savePreferences(); renderPages(); requestAnimationFrame(scrollToCurrent); }
function setFit(fit) { if(!['screen','width'].includes(fit)||state.fit===fit) return; state.fit=fit; savePreferences(); controls(); requestAnimationFrame(scrollToCurrent); }
async function loadProject(id,pageId='') {
  const version=++state.loadVersion; state.loading=true; controls(); say('작품을 불러오고 있어요.');
  try {
    const project=await get('/api/story/projects/'+encodeURIComponent(id));
    if(version!==state.loadVersion) return;
    state.projectId=id; state.project=project; state.pages=Array.isArray(project.pages)?project.pages:[];
    const index=state.pages.findIndex(page=>page.id===pageId); state.index=index>=0?index:0;
    $('bookTitle').textContent=project.title||'제목 없는 만화'; document.title=(project.title||'만화 보기')+' · 한 컷씩';
    $('projectSelect').value=id; $('pageSelect').replaceChildren();
    for(const [i,page] of state.pages.entries()) {const option=node('option',(i+1)+'페이지'+(page.image_url?'':' · 그림 없음'));option.value=page.id;$('pageSelect').append(option);}
    if(!state.pages.length) {const option=node('option','페이지 없음');option.value='';$('pageSelect').append(option);}
    state.loading=false; renderPages(); updateUrl();
    const imageCount=state.pages.filter(page=>Boolean(safeImage(page.image_url||''))).length;
    if(pageId&&index<0) say('지정한 페이지를 찾지 못해 첫 페이지부터 표시했어요.');
    else if(imageCount<state.pages.length) say(state.pages.length+'페이지 중 '+imageCount+'페이지에 그림이 있어요. 나머지도 이야기 순서에 맞춰 표시합니다.');
    else say('');
    requestAnimationFrame(scrollToCurrent);
  } catch(error) { if(version===state.loadVersion) {state.loading=false;$('projectSelect').value=state.projectId;say(error.message,true);controls();} }
}
async function init() {
  readPreferences(); controls();
  const bootstrap=await get('/api/workspace');
  const projects=Array.isArray(bootstrap.projects)?bootstrap.projects:[];
  $('projectSelect').replaceChildren();
  for(const project of projects) {const option=node('option',project.title||project.id);option.value=project.id;$('projectSelect').append(option);}
  if(state.projectId&&!projects.some(project=>project.id===state.projectId)) {const option=node('option','링크로 연 작품');option.value=state.projectId;$('projectSelect').append(option);}
  const id=state.projectId||(projects[0]&&projects[0].id);
  if(id) await loadProject(id,state.requestedPage);
  else {state.loading=false;$('bookTitle').textContent='만화 보기';renderPages();say('저장된 작품이 없습니다. 작업실에서 이야기를 만들어 주세요.');}
  measureToolbar();
}
$('previous').addEventListener('click',()=>navigate(state.index-1));
$('next').addEventListener('click',()=>navigate(state.index+1));
$('pageSelect').addEventListener('change',()=>navigate(state.pages.findIndex(page=>page.id===$('pageSelect').value)));
$('projectSelect').addEventListener('change',()=>{if($('projectSelect').value)loadProject($('projectSelect').value);});
$('refresh').addEventListener('click',()=>{if(state.projectId)loadProject(state.projectId,state.pages[state.index]&&state.pages[state.index].id);else init().catch(error=>say(error.message,true));});
$('singleMode').addEventListener('click',()=>setMode('single'));
$('verticalMode').addEventListener('click',()=>setMode('vertical'));
$('screenFit').addEventListener('click',()=>setFit('screen'));
$('widthFit').addEventListener('click',()=>setFit('width'));
document.addEventListener('keydown',event=>{const target=event.target; if(event.defaultPrevented||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||(target&&(target.isContentEditable||['INPUT','TEXTAREA','SELECT'].includes(target.tagName))))return;if(event.key==='ArrowLeft'){event.preventDefault();navigate(state.index-1);}else if(event.key==='ArrowRight'){event.preventDefault();navigate(state.index+1);}});
window.addEventListener('scroll',scheduleScrollTrack,{passive:true});
window.addEventListener('resize',()=>{measureToolbar();scheduleScrollTrack();});
if(typeof ResizeObserver==='function') new ResizeObserver(measureToolbar).observe($('toolbar'));
init().catch(error=>{state.loading=false;$('bookTitle').textContent='만화 보기';say(error.message,true);controls();});
</script>
</body>
</html>
